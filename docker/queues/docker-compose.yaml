---
services:
  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:4.1.3-management
    restart: unless-stopped
    ports:
      - ${RABBITMQ_PORT}:${RABBITMQ_PORT}
      - ${RABBITMQ_MANAGEMENT_PORT}
    env_file:
      - .env
    volumes:
      - ./rabbitmq/data:/var/lib/rabbitmq
      - ./rabbitmq/logs:/var/log/rabbitmq
    networks:
      - nexus
      - queues
    healthcheck:
      test: curl --fail -s http://localhost:${RABBITMQ_MANAGEMENT_PORT}/api/health || exit 1
      interval: 10s
      timeout: 10s
      retries: 5

volumes:
  rabbitmq:
    name: rabbitmq
    external: true
    driver: local

networks:
  nexus:
    name: nexus
    external: true
  queues:
    name: queues
    driver: bridge