---
services:
  minio:
    container_name: minio
    image: minio/minio:latest
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - ${MINIO_S3_PORT}:${MINIO_S3_PORT}
      - ${MINIO_CONSOLE_PORT}
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":${MINIO_CONSOLE_PORT}"
    volumes:
      - ./minio/data:/data
      - ./minio/logs:/var/log/minio
    depends_on:
      - caddy
    networks:
      - nexus
      - media
    healthcheck:
      test: curl --fail -s http://localhost:${MINIO_CONSOLE_PORT} || exit 1
      interval: 10s
      timeout: 10s
      retries: 5

  sftpgo:
    container_name: sftpgo
    image: drakkan/sftpgo:latest
    ports:
      - "2022:2022"   # SFTP
      - "2021:2021"   # FTP
      - "8080"        # Web UI / REST API
      - "9090:9090"   # WebDAV
    env_file:
      - .env
    volumes:
      - ./sftpgo/data:/srv/sftpgo:z
      - ./sftpgo/config:/var/lib/sftpgo:z
      - ./sftpgo/etc:/etc/sftpgo:z
    networks:
      - nexus
      - media
    healthcheck:
      test: curl --fail -s http://localhost:8080 || exit 1
      interval: 10s
      timeout: 10s
      retries: 5

  filebrowser:
    container_name: filebrowser
    image: filebrowser/filebrowser:s6
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - ${FILEBROWSER_PORT}
    environment:
      PGID: $(id -g)
      PUID: $(id -u)
    depends_on:
      - caddy
    volumes:
      - ./filebrowser/database:/database
      - ./filebrowser/srv:/srv
      - ./filebrowser/config:/config
    networks:
      - nexus
      - media
    healthcheck:
      test: curl --fail -s http://localhost:${FILEBROWSER_PORT} || exit 1
      interval: 10s
      timeout: 10s
      retries: 5

volumes:
  minio:
    name: minio
    external: true
    driver: local
  sftpgo:
    name: sftpgo
    external: true
    driver: local
  filebrowser:
    name: filebrowser
    external: true
    driver: local

networks:
  media:
    name: media
    driver: bridge
  nexus:
    name: nexus
    external: true